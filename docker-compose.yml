services:

  postgres:
    image: postgres:17-alpine

    container_name: sports-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: sportsdb
      POSTGRES_USER: sportsuser
      POSTGRES_PASSWORD: sportspassword

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - sports-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sportsuser -d sportsdb"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: sports-backend

    restart: unless-stopped

    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sportsdb
      DB_USER: sportsuser
      DB_PASSWORD: sportspassword

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - sports-network


  frontend:
    build:
      context: ./frontend

    container_name: sports-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - sports-network


networks:

  sports-network:
    driver: bridge


volumes:

  postgres_data:
